      <stop offset="1" stop-color="#101723" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text {font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;}
    .sector {fill:#322F2A;stroke:#C5A464;stroke-opacity:.52;stroke-width:1.2;}
    .icon {fill:none;stroke:#F2C879;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .leader {fill:none;stroke:#827451;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;}
    .label-title {font-size:25px;font-weight:600;fill:#F2C879;}
    .label-subtitle {font-size:18px;font-weight:400;fill:#C5CCD5;}
  </style>
