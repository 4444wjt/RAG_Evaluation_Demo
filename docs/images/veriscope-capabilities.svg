<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="capability-title capability-desc">
  <title id="capability-title">VeriScope AI 六项核验能力与证据导航</title>
  <desc id="capability-desc">六个等分环形扇区：工程创新，自资料诊断与失败契约；证据追溯，逐句原文与版本绑定；门禁复核，离线回放与差异对照；风险与人工复核，未决保留与人工接管；外部接入，真实 RAG 与自选资料；开源上游贡献，pypdf 两项修复已合并。扇区等分，不代表能力评分或比赛得分。证据链接见 README 图下文字表。</desc>
  <defs>
    <radialGradient id="backlight" cx="50%" cy="48%" r="48%">
