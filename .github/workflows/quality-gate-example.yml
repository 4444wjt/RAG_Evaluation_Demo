# 质量门禁接入 CI 的示例：对已归档的评测结果离线重新执行门禁裁决，不调用模型、不需要密钥。
# 裁决不通过时本步骤失败（退出码 1），可作为合并或发布前的卡口。
# 仅手动触发，不参与日常 CI；默认输入是 25 题正式运行（真实 FAIL），因此默认运行结果为失败，用来演示拦截。
name: Quality gate example

on:
  workflow_dispatch:
    inputs:
      result:
        description: "评测结果 JSON（API 返回体或演示快照）"
        required: true
        default: docs/competition/evidence/20261005T144504Z-full-39511424/api-response.json
        type: choice
        options:
          - docs/competition/evidence/20261005T144504Z-full-39511424/api-response.json
          - frontend/src/fixtures/demo.json
      faith:
        description: "正向忠实度阈值"
        required: true
        default: "0.8"
      ctx:
        description: "正向上下文精度阈值"
        required: true
        default: "0.8"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 使用仓库根目录的 action.yml；其他仓库写 uses: 4444wjt/RAG_Evaluation_Demo@<tag 或分支>。
      # 结果表写入作业摘要，JUnit 报告由下一步发布到检查结果。
      - name: Replay quality gate
        uses: ./
        with:
          result: ${{ inputs.result }}
          faith: ${{ inputs.faith }}
          ctx: ${{ inputs.ctx }}
          junit: quality-gate.junit.xml

      - name: Publish gate report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        with:
          files: quality-gate.junit.xml
          check_name: Quality gate report
