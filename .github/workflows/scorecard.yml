# OpenSSF Scorecard：每周及推送 master 时对仓库做供应链安全评分，结果上传到 GitHub 代码扫描并公开发布到 scorecard.dev。
# 发布结果（publish_results）时，Scorecard 要求本工作流只使用固定版本的少数官方 Action，且不设顶层 env / defaults。
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
