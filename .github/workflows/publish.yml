name: Publish statute CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after configuring the pypi environment and Trusted Publisher"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install build==1.6.1 setuptools==84.0.0
      - name: Stage the existing CLI sources and build from sdist
        run: |
          python packaging/veriscope/stage.py
          python -m build --no-isolation packaging/veriscope --outdir dist
      - name: Validate metadata and install outside the checkout
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import json
          import os
          import subprocess
          import tempfile
          import tomllib
          import venv
          import zipfile

          project = tomllib.loads(Path("packaging/veriscope/pyproject.toml").read_text())["project"]
          if os.environ["REF_TYPE"] == "tag":
              assert os.environ["REF_NAME"] == "cli-v" + project["version"], "Tag/package version mismatch"
          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              metadata_path, = (name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_path))
          assert metadata["Name"] == "veriscope" and metadata["Version"] == project["version"]
          assert not metadata.get_all("Requires-Dist"), "The statute CLI must remain dependency-free"
          with tempfile.TemporaryDirectory() as directory:
              sandbox = Path(directory)
              venv.create(sandbox / "venv", with_pip=True)
              python = sandbox / "venv/bin/python"
              cli = sandbox / "venv/bin/veriscope-statute"
              subprocess.run([str(python), "-m", "pip", "install", "--no-index", "--no-deps", str(wheel.resolve())], check=True, cwd=sandbox)
              subprocess.run([str(cli), "--help"], check=True, cwd=sandbox)
              example = subprocess.run([str(cli), "--example", "--json"], capture_output=True, text=True, cwd=sandbox)
              assert example.returncode == 1, (example.returncode, example.stdout, example.stderr)
              json.loads(example.stdout)
              print("Clean install passed; help=0, constructed example=1 (expected detection).")
          PY
          sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish with Trusted Publishing and PyPA metadata checks
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          attestations: true
