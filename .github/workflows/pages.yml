# 备用演示站：用仓库内同一份只读快照构建纯静态前端，发布到 GitHub Pages。
# 不含后端，不调用模型；服务器或隧道中断时评委仍可打开。
# 首次使用前需在仓库 Settings → Pages 把 Source 设为 “GitHub Actions”。
name: Pages demo

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # 相对 base：站点位于 /<仓库名>/ 子路径下；页面内是哈希路由，无需服务端回退。
      - name: Build static read-only site
        run: npx vite build --base=./
        env:
          VITE_READ_ONLY: "1"
          VITE_STATIC_SITE: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
