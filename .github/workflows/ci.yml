name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Syntax check (project sources)
        run: python -m compileall -q main.py backend scripts tests

      - name: Run tests
        run: python -m pytest -q -ra tests

  # 自检仓库根目录的 action.yml：演示快照应放行，25 题正式运行（真实 FAIL）应拦截。
  gate-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate passes the demo snapshot
        id: demo
        uses: ./
        with:
          result: frontend/src/fixtures/demo.json
          junit: gate-demo.junit.xml

      - name: Gate compares against a baseline (same snapshot, no regression)
        id: baseline
        uses: ./
        with:
          result: frontend/src/fixtures/demo.json
          baseline: frontend/src/fixtures/demo.json
          summary: "false"

      - name: Gate blocks the 25-question formal run (expected failure)
        id: full
        continue-on-error: true
        uses: ./
        with:
          result: docs/competition/evidence/20261005T144504Z-full-39511424/api-response.json
          junit: gate-full.junit.xml

      - name: Check gate outcomes and JUnit reports
        env:
          DEMO_PASSED: ${{ steps.demo.outputs.passed }}
          BASELINE_PASSED: ${{ steps.baseline.outputs.passed }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
        run: |
          test "$DEMO_PASSED" = "true"
          test "$BASELINE_PASSED" = "true"
          test "$FULL_OUTCOME" = "failure"
          grep -q 'failures="0"' gate-demo.junit.xml
          grep -q 'failures="1"' gate-full.junit.xml
          grep -q 'pos_faithfulness' gate-full.junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
